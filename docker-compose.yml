services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python","-m","app.worker"]
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    depends_on:
      - api
