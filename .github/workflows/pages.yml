name: Deploy Career Fit website

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Publish at /career-fit-agent/site/ while keeping the existing root app URL.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v4
