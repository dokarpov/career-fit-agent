name: Publish RoleHint website (manual Pages source)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify website files
        run: |
          test -s site/index.html
          test -s site/workspace.html
          test -s site/landing.css
          test -s site/workspace.js
          test -s site/product.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload only the public website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
