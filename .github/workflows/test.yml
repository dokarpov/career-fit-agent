name: test
on:
  workflow_dispatch:

concurrency:
  group: career-fit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install -r backend/requirements.txt
      - run: node --test
      - name: Python tests
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          CFA_RUNTIME_MODE: managed
          CFA_SEED_DEMO: '1'
          CFA_TOKEN_ENCRYPTION_KEY: UGE8w_aeBthb3b8cdtsjBPzlkp6pUFmXdavs_DT7mYI=
          TELEGRAM_BOT_TOKEN: 123:TEST
          TELEGRAM_MINI_APP_URL: https://example.test/miniapp/
          CFA_INTERNAL_BOT_SECRET: test
        run: python -m unittest discover -s backend/tests

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 >/tmp/http.log 2>&1 &
          sleep 2
      - env:
          BASE_URL: http://127.0.0.1:4173
        run: node tests/browser-smoke.mjs
